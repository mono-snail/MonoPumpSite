<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,follow,noarchive">
    <meta name="theme-color" content="#fffaf8">
    <title>Page Not Found - MonoPump</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #171820;
        background: #fffaf8;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main { width: min(560px, 100%); }
      p { color: #696874; line-height: 1.6; }
      h1 { margin: 8px 0 16px; font-size: clamp(2.25rem, 8vw, 4.5rem); line-height: 1; }
      .code { color: #c92d53; font-weight: 700; letter-spacing: 0; }
      a { color: #fff; background: #c92d53; display: inline-block; margin-top: 20px; padding: 12px 18px; border-radius: 6px; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #5f74ee; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The address may have changed, or the page is no longer available.</p>
      <a href="/">Return to MonoPump</a>
    </main>
  </body>
</html>
